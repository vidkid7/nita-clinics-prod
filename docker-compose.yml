services:
  postgres:
    image: postgres:18-alpine
    container_name: nita-postgres
    environment:
      POSTGRES_USER: dental_user
      POSTGRES_PASSWORD: dental_password
      POSTGRES_DB: dental_db
    ports:
      - "5435:5432"
    volumes:
      - nita_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dental_user -d dental_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: nita-redis
    ports:
      - "6380:6379"
    volumes:
      - nita_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  nita_postgres_data:
  nita_redis_data:
